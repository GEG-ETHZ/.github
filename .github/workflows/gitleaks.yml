name: gitleaks

# Scans the full history of a repository for secrets. One copy for the whole
# organisation: an organisation ruleset ("Require workflows to pass before
# merging") runs this file in every repository it targets, so no repository
# pins gitleaks in its own CI. How it is set up: computing/code/secrets.md in
# geg-ops.
#
# Rulesets run a workflow only on pull_request, pull_request_target and
# merge_group, with their default activity types; filters are ignored. push
# runs it here too, on main of this repository.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      # Pinned to a commit, not a tag: a tag can be moved onto other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The binary, not gitleaks/gitleaks-action: the action wants a licence key
      # in an organisation, which is one more secret to store.
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks

      # A repository's own .gitleaks.toml (allowlists, extra rules) is picked
      # up from its root automatically.
      - name: Scan the full history for secrets
        run: ./gitleaks git . --redact --verbose --exit-code 1
